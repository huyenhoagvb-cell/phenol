<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Củng cố bài Phenol</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script><style>:root{--main:#6c5ce7;--acc:#fab1a0}body{font-family:'Mali',cursive;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background-color:#ffdee9;background-image:radial-gradient(rgba(255,255,255,0.4) 20%,transparent 20%);background-size:30px 30px}.box{background:rgba(255,255,255,0.95);width:95%;max-width:1000px;border-radius:25px;border:5px solid white;box-shadow:0 10px 30px rgba(0,0,0,0.15);overflow:hidden;min-height:600px;display:flex;flex-direction:column}.screen{display:none;flex:1;flex-direction:column;padding:20px;animation:FadeIn 0.5s}.screen.active{display:flex}@keyframes FadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.welcome{text-align:center;flex:1;justify-content:center;align-items:center;display:flex;flex-direction:column}.welcome h1{color:var(--main);font-size:3em;margin:0;text-shadow:2px 2px 0 #fff}.inp{padding:15px;border:3px solid #dfe6e9;border-radius:15px;font-size:1.2em;width:80%;max-width:400px;margin:10px 0;text-align:center;font-family:inherit}.btn{padding:15px 40px;background:var(--main);color:white;border:none;border-radius:50px;font-size:1.5em;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #4834d4;transition:0.2s;margin-top:20px}.btn:active{transform:translateY(5px);box-shadow:none}.top{display:flex;justify-content:space-between;padding:15px 30px;background:white;border-bottom:3px solid #eee;font-weight:bold;color:#636e72;font-size:1.2em}.game-body{display:flex;flex:1;padding:20px;gap:20px;flex-wrap:wrap}.left{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:300px}.right{flex:1;position:relative;background:#eee;border-radius:20px;overflow:hidden;border:4px solid white;box-shadow:0 5px 15px rgba(0,0,0,0.1);min-height:300px;min-width:300px}.q-box{background:white;padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,0.05);border:2px solid #eee}.q-text{font-size:1.6em;margin-bottom:30px;color:#2d3436}.q-text sub, .q-text sup, .opt sub, .opt sup {font-size:75%;line-height:0;position:relative;vertical-align:baseline}.q-text sup, .opt sup{top:-0.5em}.q-text sub, .opt sub{bottom:-0.25em}.opts{display:grid;grid-template-columns:1fr 1fr;gap:15px}.opt{background:white;border:2px solid #dfe6e9;padding:15px;border-radius:15px;font-size:1.1em;cursor:pointer;font-weight:bold;color:#636e72;transition:0.2s;box-shadow:0 4px 0 #dfe6e9;display:flex;align-items:center;justify-content:center}.opt:hover{border-color:var(--main);color:var(--main)}.opt:active{transform:translateY(4px);box-shadow:none}.opt.correct{background:#00b894;color:white;border-color:#00b894;box-shadow:0 4px 0 #009476}.opt.wrong{background:#ff7675;color:white;border-color:#ff7675;box-shadow:0 4px 0 #d63031;animation:Shake 0.4s}.grid{position:absolute;top:0;left:0;width:100%;height:100%;display:grid}.tile{background:var(--main);border:1px solid white;display:flex;justify-content:center;align-items:center;color:rgba(255,255,255,0.3);font-size:2em;font-weight:bold;transition:0.5s}.tile:nth-child(even){background:#a29bfe}.tile.hide{transform:scale(0) rotate(180deg);opacity:0}.win-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:99;backdrop-filter:blur(5px)}.win-content{background:white;padding:40px;border-radius:30px;text-align:center;max-width:600px;animation:Pop 0.4s}@keyframes Shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}@keyframes Pop{from{transform:scale(0)}to{transform:scale(1)}}</style></head><body><audio id=
